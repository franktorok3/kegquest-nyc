name: Refresh brewery sources
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brewery-ingestion
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ingest
      - run: npm test
      - run: npm run build
      - name: Commit checked snapshot
        run: |
          git config user.name 'KegQuest source refresh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/breweries.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh brewery source snapshots'
            git push
          fi
