name: Discover brewery candidates
on:
  schedule:
    - cron: '37 11 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brewery-ingestion
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/discover.mjs
      - name: Commit review queue
        run: |
          git config user.name 'Tapbound discovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/discovery.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh directory candidate review queue'
            git push
          fi
